name: Build Artisan for macOS

# Builds Artisan.app / .dmg on GitHub's hosted macOS runners, for both Apple Silicon
# and Intel. Run it from the Actions tab (Run workflow), or let it fire on every push
# to the since-drop-timer branch. The .dmg files appear as downloadable artifacts at
# the bottom of the run page.

on:
  workflow_dispatch:
  push:
    branches:
      - since-drop-timer

permissions:
  contents: read

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15          # Apple Silicon
          - arch: x86_64
            runner: macos-15-intel    # Intel (GitHub retires x86_64 runners in Aug 2027)

    env:
      PYTHON_V: '3.13'
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      PYUIC: pyuic6
      PYLUPDATE: ./pylupdate6pro.py

    steps:
      - name: Check out the fork
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          set -e
          python -m pip install --upgrade pip
          # qt6-tools has no universal macOS wheel; we take lrelease from Homebrew's Qt instead
          grep -v '^qt6-tools' src/requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt
          python -c "import platform; print('building on', platform.machine())"

      - name: Locate Qt tooling
        run: |
          set -e
          QT_PATH=$(python -c "import PyQt6, os; print(os.path.join(os.path.dirname(PyQt6.__file__), 'Qt6'))")
          echo "QT_PATH=$QT_PATH" >> "$GITHUB_ENV"
          # build-derived.sh looks for $QT_SRC_PATH/bin/lrelease
          if [ -x "$QT_PATH/bin/lrelease" ]; then
            echo "QT_SRC_PATH=$QT_PATH" >> "$GITHUB_ENV"
          else
            brew install qt
            echo "QT_SRC_PATH=$(brew --prefix qt)" >> "$GITHUB_ENV"
          fi

      - name: Target ${{ matrix.arch }}
        working-directory: src
        run: |
          set -e
          sed -i '' "s/target_arch='[^']*'/target_arch='${{ matrix.arch }}'/" artisan-mac.spec
          sed -i '' "s/'LSArchitecturePriority': \[[^]]*\]/'LSArchitecturePriority': ['${{ matrix.arch }}']/" artisan-mac.spec
          sed -i '' "s/__artisan_os__ = '.*'/__artisan_os__ = 'macOS'/" artisanlib/__init__.py
          sed -i '' "s/__revision__ = '.*'/__revision__ = '$(git rev-parse --short HEAD)'/" artisanlib/__init__.py
          grep -n "target_arch\|LSArchitecturePriority" artisan-mac.spec
          grep -n "__revision__\|__artisan_os__" artisanlib/__init__.py

      - name: Generate derived files (ui, translations, help)
        working-directory: src
        run: |
          set -e
          chmod +x ./*.sh ./pylupdate6pro.py
          ./build-derived.sh macos

      - name: Build the app bundle
        working-directory: src
        run: |
          set -e
          pyinstaller -y --log-level=INFO artisan-mac.spec

      - name: Name the outputs
        working-directory: src
        run: |
          set -e
          VERSION=$(python -c "import artisanlib; print(artisanlib.__version__)")
          mv artisan-mac-${VERSION}.dmg artisan-mac-${VERSION}-sincedrop-${{ matrix.arch }}.dmg
          ls -lh *.dmg
          du -sh dist/Artisan.app

      - name: Upload the .dmg
        uses: actions/upload-artifact@v4
        with:
          name: artisan-sincedrop-${{ matrix.arch }}-dmg
          path: src/*.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Upload the raw .app (fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artisan-sincedrop-${{ matrix.arch }}-app
          path: src/dist/Artisan.app
          if-no-files-found: warn
          retention-days: 14
